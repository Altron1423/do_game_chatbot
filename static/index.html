<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Танковый чат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Танковый чат</h1>
    <span id="room-status">Подключение…</span>
  </header>
  <main>
    <section class="arena">
      <div id="stats" class="stats" aria-label="Статистика убийств">
        <h2>Убийства</h2>
        <ol id="kills-list"></ol>
      </div>
      <canvas id="board" aria-label="Игровое поле"></canvas>
      <p id="hint">Для отправки сообщений и команд используйте терминальный клиент.</p>
    </section>
    <section class="chat-panel">
      <h2>Чат комнаты</h2>
      <ol id="chat"></ol>
      <p>Только просмотр. Для регистрации и отправки команд используйте терминальный клиент.</p>
    </section>
  </main>
  <script src="/static/game.js"></script>
</body>
</html>
